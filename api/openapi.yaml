openapi: 3.1.0
info:
  title: Pulse API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /events:
    get:
      operationId: streamLibraryChanges
      summary: Stream committed library change signals
      description: >
        Opens an SSE stream. Each `library-change` event is a lightweight
        invalidation signal; clients must reconcile Sources, Stories, and
        unread counts through the HTTP API. The stream sends heartbeat
        comments and supports normal EventSource retry behavior, but does not
        replay historical events.
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  SSE frames containing `library-change` events and heartbeat
                  comments.
        "500":
          description: Streaming is not supported by the server
  /sources:
    get:
      operationId: listSources
      responses:
        "200":
          description: Active sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
    post:
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSource"
      responses:
        "201":
          description: Source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "422":
          $ref: "#/components/responses/Problem"
  /sources/order:
    put:
      operationId: reorderRootSources
      summary: Persist the order of unfiled root Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ids]
              additionalProperties: false
              properties:
                source_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Root Source order persisted
        "422":
          $ref: "#/components/responses/Problem"
  /sources/preview:
    post:
      operationId: previewSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSource"
      responses:
        "200":
          description: Ephemeral candidate and identity preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePreview"
        "422":
          $ref: "#/components/responses/Problem"
  /sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSource
      responses:
        "200":
          description: Source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [enabled]
                  additionalProperties: false
                  properties:
                    enabled:
                      type: boolean
                - type: object
                  required: [name, locator]
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    locator:
                      type: string
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: archiveSource
      description: Archives the Source and preserves existing Entries.
      responses:
        "204":
          description: Source archived
        "404":
          $ref: "#/components/responses/Problem"
  /sources/{sourceId}/runs:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: runSource
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      responses:
        "202":
          description: Acquisition enqueued
  /sources/{sourceId}/health:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSourceHealth
      responses:
        "200":
          description: Latest acquisition health and scheduling statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceHealth"
  /sources/{sourceId}/entries:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: listSourceEntries
      summary: List Source Entries with owning Story state
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [inbox, unread, starred, later, hidden]
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Source Entries and their real owning Story projections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceEntryPage"
    post:
      operationId: createManualEntry
      description: >
        Enqueues a Manual Entry. When an HTTP(S) URL is supplied without
        content_html, Pulse fetches it through the controlled HTTP client and
        stores a sanitized readability snapshot. Fetch or extraction failure
        still preserves the URL-only Entry.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushedCandidate"
      responses:
        "202":
          description: Manual Entry and optional article snapshot acquisition enqueued
  /sources/{sourceId}/annotations:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: importAnnotations
      description: Enqueues an atomic batch of book annotations for an annotations Source.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationBatch"
      responses:
        "202":
          description: Annotation Acquisition enqueued
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /sources/{sourceId}/secret:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: rotateSourceSecret
      responses:
        "200":
          description: Newly generated Source secret, returned once
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret:
                    type: string
  /webhooks/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: receiveWebhook
      parameters:
        - name: X-Pulse-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushedCandidate"
      responses:
        "202":
          description: Webhook acquisition enqueued
        "401":
          $ref: "#/components/responses/Problem"
  /stories:
    get:
      operationId: listStories
      description: Lists Story clusters. A single Entry is represented by a one-Entry Story.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [inbox, unread, starred, later, hidden]
        - name: tag
          in: query
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stories ordered by unread bucket, stable Story sort time, and Story ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPage"
    patch:
      operationId: markStoriesRead
      description: Marks matching Stories as read. When story_ids is provided, only those Stories are updated; otherwise source_id scopes the update.
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  type: boolean
                  const: true
                story_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  description: Exact Story IDs to update. When omitted, the optional source_id scope is used.
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Number of Stories newly marked as read
          content:
            application/json:
              schema:
                type: object
                required: [updated_count]
                properties:
                  updated_count:
                    type: integer
                    format: int64
  /stories/{storyId}:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStory
      responses:
        "200":
          description: Story and all Source Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateStory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryPatch"
      responses:
        "200":
          description: Updated Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
  /stories/{storyId}/ai-summary:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestStorySummary
      summary: Queue an explicit AI StorySummary
      description: Queues content-level summarization for one Story without changing Reader state.
      responses:
        "202":
          description: StorySummary job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIJob"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /stories/{storyId}/representative:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setStoryRepresentative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_id]
              additionalProperties: false
              properties:
                entry_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Story with the explicitly selected representative Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          $ref: "#/components/responses/Problem"
  /stories/{storyId}/merge:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: mergeStory
      summary: Manually merge one Story into another
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              properties:
                into:
                  type: string
                  format: uuid
                  description: The Story that absorbs the path Story.
                display_title:
                  type: string
                  description: Explicitly selected surviving display title when the two Stories conflict.
                note:
                  type: string
                  description: Explicitly selected surviving Note when the two Stories conflict.
      responses:
        "200":
          description: Merged Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /stories/{storyId}/split:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: splitStory
      summary: Detach an Entry from a Story into its own Story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_id]
              properties:
                entry_id:
                  type: string
                  format: uuid
                  description: The member Entry to detach.
                copy_display_title:
                  type: boolean
                move_display_title:
                  type: boolean
                copy_note:
                  type: boolean
                move_note:
                  type: boolean
                copy_tags:
                  type: boolean
                move_tags:
                  type: boolean
      responses:
        "200":
          description: The newly created single-Entry Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /stories/recluster:
    post:
      operationId: reclusterStories
      summary: Re-run Story aggregation on demand
      description: >
        Drains pending Story aggregation immediately, re-evaluating single-Entry
        Stories (and embedding backfill) instead of waiting for the background
        tick. Useful after a model or algorithm change. Returns the number of
        Entries processed in this pass.
      responses:
        "200":
          description: Recluster completed
          content:
            application/json:
              schema:
                type: object
                required: [processed]
                properties:
                  processed:
                    type: integer
                    description: Number of Entries re-evaluated.
        "503":
          description: No aggregation processor is wired into this process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /stories/{storyId}/tags:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addStoryTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Story tag added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
  /stories/{storyId}/tags/{tagId}:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/TagId"
    delete:
      operationId: removeStoryTag
      responses:
        "204":
          description: User tag removed
  /digests:
    get:
      operationId: listDigests
      summary: List persisted AI Digests
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Persisted Digest history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Digest"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDigest
      summary: Queue an explicit title-only Catch-up Digest
      description: >
        Selects unread, non-hidden Stories into a fixed snapshot and sends only
        titles and necessary metadata to the configured AI Provider. It never
        marks the source Stories as read.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigestScope"
      responses:
        "202":
          description: Digest job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIJob"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /digests/preview:
    get:
      operationId: previewDigest
      summary: Preview the current Catch-up Digest scope
      parameters:
        - name: start_at
          in: query
          schema:
            type: string
            format: date-time
        - name: end_at
          in: query
          schema:
            type: string
            format: date-time
        - name: max_stories
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Matching unread Story count and queueability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestPreview"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /digests/{digestId}:
    parameters:
      - name: digestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDigest
      summary: Get one persisted Digest
      responses:
        "200":
          description: Digest with structured sections and Story references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Digest"
        "404":
          $ref: "#/components/responses/Problem"
  /entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEntry
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
    delete:
      operationId: deleteEntry
      summary: Permanently delete source data and write an Entry Tombstone
      parameters:
        - name: confirm
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Entry deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Deleting the final Entry requires explicit confirmation of Story metadata loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionConfirmation"
  /entries/{entryId}/export.md:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      operationId: exportEntryMarkdown
      responses:
        "200":
          description: Single Entry Markdown export
          content:
            text/markdown:
              schema:
                type: string
  /folders:
    get:
      operationId: listFolders
      responses:
        "200":
          description: One-level Source folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
    post:
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
  /folders/order:
    put:
      operationId: reorderFolders
      summary: Persist the Folder navigation order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder_ids]
              additionalProperties: false
              properties:
                folder_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Folder order persisted
        "422":
          $ref: "#/components/responses/Problem"
  /folders/{folderId}:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    delete:
      operationId: deleteFolder
      responses:
        "204":
          description: Folder deleted
  /folders/{folderId}/sources/order:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    put:
      operationId: reorderFolderSources
      summary: Persist the Source order within one Folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ids]
              additionalProperties: false
              properties:
                source_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Folder Source order persisted
        "422":
          $ref: "#/components/responses/Problem"
  /folders/{folderId}/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/FolderId"
      - $ref: "#/components/parameters/SourceId"
    put:
      operationId: addSourceToFolder
      responses:
        "204":
          description: Source associated
    delete:
      operationId: removeSourceFromFolder
      responses:
        "204":
          description: Source association removed
  /views:
    get:
      operationId: listViews
      responses:
        "200":
          description: Saved Entry queries
    post:
      operationId: createView
      responses:
        "201":
          description: View created
  /views/{viewId}:
    parameters:
      - $ref: "#/components/parameters/ViewId"
    put:
      operationId: updateView
      responses:
        "200":
          description: View updated
    delete:
      operationId: deleteView
      responses:
        "204":
          description: View deleted
  /rules:
    get:
      operationId: listRules
      responses:
        "200":
          description: Structured rules
    post:
      operationId: createRule
      responses:
        "201":
          description: Rule created
  /rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    get:
      operationId: getRule
      responses:
        "200":
          description: Rule
    put:
      operationId: updateRule
      responses:
        "200":
          description: Rule version updated
    delete:
      operationId: deleteRule
      responses:
        "204":
          description: Rule deleted
  /rules/{ruleId}/preview:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    post:
      operationId: previewRule
      responses:
        "200":
          description: Read-only historical match preview
  /rules/{ruleId}/replay:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    post:
      operationId: replayRule
      responses:
        "200":
          description: Historical replay summary; Effects default to disabled
  /export/config:
    get:
      operationId: exportRedactedConfig
      responses:
        "200":
          description: Redacted Source, Rule and View configuration
  /opml/import:
    post:
      operationId: importOPML
      requestBody:
        required: true
        content:
          text/x-opml:
            schema:
              type: string
      responses:
        "200":
          description: OPML import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OPMLImportResult"
        "400":
          $ref: "#/components/responses/Problem"
  /opml/export:
    get:
      operationId: exportOPML
      responses:
        "200":
          description: OPML subscription document
          content:
            text/x-opml:
              schema:
                type: string
  /ai/tools:
    get:
      operationId: listChatTools
      summary: List selection tools in display order
      responses:
        "200":
          description: Selection tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectionTool"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createChatTool
      summary: Create a selection tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionToolInput"
      responses:
        "201":
          description: Tool created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectionTool"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ai/tools/order:
    put:
      operationId: reorderChatTools
      summary: Atomically rewrite selection-tool display order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_ids]
              properties:
                tool_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Tools in the new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectionTool"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ai/tools/{toolId}:
    parameters:
      - name: toolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getChatTool
      responses:
        "200":
          description: Selection tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectionTool"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateChatTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionToolInput"
      responses:
        "200":
          description: Updated tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectionTool"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteChatTool
      responses:
        "204":
          description: Tool deleted
        "404":
          $ref: "#/components/responses/Problem"
  /ai/conversations:
    get:
      operationId: listConversations
      summary: List AI conversation history by recent activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Conversation history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConversation
      summary: Start a Conversation from a selection
      description: >
        Resolves the enabled tool server-side, validates the selection, expands
        {{selection}}, and persists immutable snapshots of the tool name,
        template, and selected text. No Source, Entry, Story, page-origin, or
        tool reference is stored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationInput"
      responses:
        "201":
          description: Conversation and first User Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCreated"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ai/conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getConversation
      responses:
        "200":
          description: Conversation with full message history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteConversation
      summary: Delete a Conversation and all of its messages
      responses:
        "204":
          description: Conversation deleted
        "404":
          $ref: "#/components/responses/Problem"
  /ai/conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendFollowUp
      summary: Append a follow-up User Message
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpInput"
      responses:
        "201":
          description: Appended User Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ai/conversations/{conversationId}/generate:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateAssistant
      summary: Stream the Assistant reply for the latest unanswered User Message
      description: >
        Emits a text/event-stream of metadata, delta, and terminal events. The
        first metadata event identifies the Conversation and Assistant Message;
        terminal events carry persisted status and safe usage metadata. A hidden
        dialog does not abort the request; explicit stop or a genuine disconnect
        terminates it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Assistant generation stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ai/conversations/{conversationId}/retry:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: retryAssistant
      summary: Retry the last failed or cancelled Assistant reply
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Assistant generation stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ai/conversations/{conversationId}/stop:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: stopGeneration
      summary: Cancel the active Assistant generation
      responses:
        "204":
          description: Generation cancellation requested
        "503":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ViewId:
      name: viewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Bounded client-supplied key. A transport retry with the same key does
        not duplicate a Conversation, User Message, or Provider request.
      schema:
        type: string
        maxLength: 128
  responses:
    Problem:
      description: Request problem
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CreateSource:
      type: object
      required: [name, kind, locator]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [rss, json-api, html, webhook, manual, file, annotations]
        locator:
          type: string
        config:
          type: object
          additionalProperties: true
        secret_ref:
          type: string
    Source:
      allOf:
        - $ref: "#/components/schemas/CreateSource"
        - type: object
          required: [id, enabled, normalized_locator, created_at, updated_at, unread_count]
          properties:
            id:
              type: string
              format: uuid
            enabled:
              type: boolean
            normalized_locator:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            unread_count:
              type: integer
              description: Number of distinct Stories represented by this Source that are unread and not hidden.
    LibraryChangeEvent:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type: string
          format: uuid
          description: Source whose committed data changed, when applicable.
    SourceHealth:
      type: object
      required: [source_id, status, duration_milliseconds, candidate_count, new_count, updated_count, consecutive_failures]
      properties:
        source_id:
          type: string
          format: uuid
        status:
          type: string
        next_scheduled_at:
          type: string
          format: date-time
        duration_milliseconds:
          type: integer
        candidate_count:
          type: integer
        new_count:
          type: integer
        updated_count:
          type: integer
        consecutive_failures:
          type: integer
    Folder:
      type: object
      required: [id, name, source_count, source_ids]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source_count:
          type: integer
        source_ids:
          type: array
          items:
            type: string
            format: uuid
    SourcePreview:
      type: object
      required: [candidates, diagnostics]
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [identity_key]
            properties:
              title:
                type: string
              url:
                type: string
              author:
                type: string
              summary:
                type: string
              identity_key:
                type: string
              identity_warning:
                type: string
        diagnostics:
          type: object
          required: [status, candidate_count]
          properties:
            status:
              type: string
            candidate_count:
              type: integer
    PushedCandidate:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        content_html:
          type: string
        published_at:
          type: string
          format: date-time
    AnnotationInput:
      type: object
      required: [provider, book_title, highlight]
      properties:
        id:
          type: string
          maxLength: 512
        provider:
          type: string
          maxLength: 64
        book_identity:
          type: string
          maxLength: 512
        book_title:
          type: string
          maxLength: 2048
        book_author:
          type: string
          maxLength: 512
        chapter:
          type: string
          maxLength: 1024
        location:
          type: string
          maxLength: 256
        highlight_color:
          type: string
          maxLength: 32
        highlight:
          type: string
          maxLength: 262144
        note:
          type: string
          maxLength: 262144
        highlighted_at:
          type: string
          format: date-time
          maxLength: 64
    AnnotationBatch:
      type: object
      required: [annotations]
      properties:
        annotations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/AnnotationInput"
    AnnotationDetail:
      type: object
      required: [provider, book_identity, book_title, book_author, chapter, location, highlight_color, annotation_note]
      properties:
        provider:
          type: string
        book_identity:
          type: string
        book_title:
          type: string
        book_author:
          type: string
        chapter:
          type: string
        location:
          type: string
        highlight_color:
          type: string
        annotation_note:
          type: string
        highlighted_at:
          type: string
          format: date-time
    Entry:
      type: object
      required: [id, source_id, identity_key, source_title, discovered_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        identity_key:
          type: string
        source_title:
          type: string
        canonical_url:
          type: string
        discovered_at:
          type: string
          format: date-time
        external_id:
          type: string
        author:
          type: string
        summary:
          type: string
        content_html:
          type: string
        published_at:
          type: string
          format: date-time
        annotation:
          $ref: "#/components/schemas/AnnotationDetail"
    SourceEntry:
      type: object
      required: [entry, story]
      properties:
        entry:
          $ref: "#/components/schemas/Entry"
        story:
          $ref: "#/components/schemas/StoryRef"
    SourceEntryPage:
      type: object
      required: [entries, total_entries, reader_counts]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SourceEntry"
        total_entries:
          type: integer
          minimum: 0
          description: Exact number of Entry rows matching the Source query.
        reader_counts:
          $ref: "#/components/schemas/ReaderCounts"
        next_cursor:
          type: string
          description: Opaque cursor for the next Source Entry page.
    StoryRef:
      type: object
      required: [id, entry_count, source_count]
      properties:
        id:
          type: string
          format: uuid
        entry_count:
          type: integer
          minimum: 1
        source_count:
          type: integer
          minimum: 1
        display_title:
          type: string
        note:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        read_at:
          type: string
          format: date-time
        starred_at:
          type: string
          format: date-time
        hidden_at:
          type: string
          format: date-time
        later_at:
          type: string
          format: date-time
    Story:
      type: object
      required: [id, representative, entry_count, source_count]
      properties:
        id:
          type: string
          format: uuid
        display_title:
          type: string
        note:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        representative:
          $ref: "#/components/schemas/Entry"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        matched_entry:
          $ref: "#/components/schemas/Entry"
        entry_count:
          type: integer
          minimum: 1
        source_count:
          type: integer
          minimum: 1
        first_published_at:
          type: string
          format: date-time
        last_published_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
        starred_at:
          type: string
          format: date-time
        hidden_at:
          type: string
          format: date-time
        later_at:
          type: string
          format: date-time
        ai_summary:
          $ref: "#/components/schemas/StoryAISummary"
    StoryPage:
      type: object
      required: [stories, total_stories, reader_counts]
      properties:
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        total_stories:
          type: integer
          minimum: 0
          description: Exact number of Stories matching the active query.
        reader_counts:
          $ref: "#/components/schemas/ReaderCounts"
        next_cursor:
          type: string
          description: Opaque cursor for the next Story page.
    AIJob:
      type: object
      required: [id, kind, target_id, status]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [story_summary, digest]
        target_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, retry, completed, partial, failed, dead]
    StoryAISummary:
      type: object
      required: [story_id, status]
      properties:
        story_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [not_requested, queued, running, completed, partial, failed, stale, unavailable]
        overview:
          type: string
        key_points:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object
            required: [label, entry_id, title, note]
            properties:
              label:
                type: string
              entry_id:
                type: string
                format: uuid
              title:
                type: string
              source_title:
                type: string
              note:
                type: string
        provider:
          type: string
        model:
          type: string
        prompt_version:
          type: string
        input_fingerprint:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DigestScope:
      type: object
      additionalProperties: false
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        max_stories:
          type: integer
          minimum: 0
          description: 0 uses the default scope and requires narrowing when it exceeds the configured safety limit.
    DigestPreview:
      type: object
      required: [scope, matching_stories, matching_stories_truncated, selected_stories, safety_limit, can_queue]
      properties:
        scope:
          $ref: "#/components/schemas/DigestScope"
        matching_stories:
          type: integer
          minimum: 0
          description: Matching Story count; when truncated, this is one greater than the safety limit.
        matching_stories_truncated:
          type: boolean
        selected_stories:
          type: integer
          minimum: 0
          description: Stories that will be processed if the scope can be queued.
        safety_limit:
          type: integer
          minimum: 1
        can_queue:
          type: boolean
    Digest:
      type: object
      required: [id, status, mode, story_count]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, partial, failed]
        mode:
          type: string
          enum: [catch_up]
        story_count:
          type: integer
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        overview:
          type: string
        themes:
          type: array
          items:
            $ref: "#/components/schemas/DigestTheme"
        priorities:
          type: array
          items:
            $ref: "#/components/schemas/DigestPriority"
        stories:
          type: array
          items:
            $ref: "#/components/schemas/DigestStory"
        omissions:
          type: array
          items:
            $ref: "#/components/schemas/DigestOmission"
        provider:
          type: string
        model:
          type: string
        prompt_version:
          type: string
        input_fingerprint:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DigestTheme:
      type: object
      required: [title, summary, story_ids]
      properties:
        title:
          type: string
        summary:
          type: string
        story_ids:
          type: array
          items:
            type: string
            format: uuid
    DigestPriority:
      type: object
      required: [rank, title, reason, story_ids]
      properties:
        rank:
          type: integer
        title:
          type: string
        reason:
          type: string
        story_ids:
          type: array
          items:
            type: string
            format: uuid
    DigestStory:
      type: object
      required: [label, story_id, title, entry_count, source_count, available]
      properties:
        label:
          type: string
        story_id:
          type: string
          format: uuid
        title:
          type: string
        entry_count:
          type: integer
        source_count:
          type: integer
        available:
          type: boolean
    DigestOmission:
      type: object
      required: [label, title, reason]
      properties:
        label:
          type: string
        story_id:
          type: string
          format: uuid
        title:
          type: string
        reason:
          type: string
    ReaderCounts:
      type: object
      required: [inbox_stories, unread_stories, starred_stories, later_stories, hidden_stories]
      properties:
        inbox_stories:
          type: integer
          minimum: 0
        unread_stories:
          type: integer
          minimum: 0
        starred_stories:
          type: integer
          minimum: 0
        later_stories:
          type: integer
          minimum: 0
        hidden_stories:
          type: integer
          minimum: 0
      description: Exact Reader counts measured in distinct Story IDs.
    DeletionConfirmation:
      type: object
      required: [code, detail, story_id, display_title, note, entry_count]
      properties:
        code:
          type: string
          const: confirmation_required
        detail:
          type: string
        story_id:
          type: string
          format: uuid
        display_title:
          type: string
        note:
          type: string
        entry_count:
          type: integer
          const: 1
    StoryPatch:
      type: object
      additionalProperties: false
      properties:
        read:
          type: boolean
        starred:
          type: boolean
        hidden:
          type: boolean
        later:
          type: boolean
        display_title:
          type: string
        note:
          type: string
    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Rule:
      type: object
      required: [name, condition, actions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        enabled:
          type: boolean
        condition:
          type: object
          additionalProperties: true
        actions:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [tag, star, read, hide, later, notification, webhook]
              value:
                type: string
    Problem:
      type: object
      required: [code, detail, field]
      properties:
        code:
          type: string
        detail:
          type: string
        field:
          type: string
    OPMLImportResult:
      type: object
      required: [created_sources, existing_sources, created_folders]
      properties:
        created_sources:
          type: integer
        existing_sources:
          type: integer
        created_folders:
          type: integer
    SelectionTool:
      type: object
      required: [id, name, prompt_template, enabled, position]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 40
        prompt_template:
          type: string
          maxLength: 4000
        enabled:
          type: boolean
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SelectionToolInput:
      type: object
      required: [name, prompt_template, enabled]
      properties:
        name:
          type: string
          maxLength: 40
        prompt_template:
          type: string
          maxLength: 4000
          description: Must reference the selection via {{selection}} at least once.
        enabled:
          type: boolean
    ChatConversation:
      type: object
      required: [id, selected_text, tool_name, prompt_template]
      properties:
        id:
          type: string
          format: uuid
        selected_text:
          type: string
        tool_name:
          type: string
        prompt_template:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatConversation"
        next_cursor:
          type: string
        has_more:
          type: boolean
    CreateConversationInput:
      type: object
      required: [tool_id, selection]
      properties:
        tool_id:
          type: string
          format: uuid
        selection:
          type: string
          maxLength: 10000
          description: Plain selected text. Oversized selections are rejected, not truncated.
    ConversationCreated:
      type: object
      required: [conversation, user_message]
      properties:
        conversation:
          $ref: "#/components/schemas/ChatConversation"
        user_message:
          $ref: "#/components/schemas/ChatMessage"
    FollowUpInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 10000
    ChatMessage:
      type: object
      required: [id, conversation_id, role, content]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        status:
          type: string
          enum: [streaming, completed, cancelled, failed]
          description: Assistant messages only.
        provider:
          type: string
        model:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        finish_reason:
          type: string
        error:
          type: string
          description: Sanitized Provider error with no credentials or auth material.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationDetail:
      type: object
      required: [conversation, messages]
      properties:
        conversation:
          $ref: "#/components/schemas/ChatConversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatStreamEvent:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [metadata, delta, completed, cancelled, failed]
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        delta:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [streaming, completed, cancelled, failed]
        provider:
          type: string
        model:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        finish_reason:
          type: string
        error:
          type: string
