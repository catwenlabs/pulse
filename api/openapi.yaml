      type: object
      required: [name, condition, actions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        enabled:
          type: boolean
        condition:
          type: object
          additionalProperties: true
        actions:
          type: array
          items:
