services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pulse-postgres-v17:/var/lib/postgresql/data

  pulse:
    build: .
    environment:
      PULSE_DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable
      PULSE_HTTP_ADDR: :8080
      PULSE_ROLES: web,scheduler,worker,effect-worker
      # Base64 of exactly 32 random bytes. Required before adding authenticated sources.
      PULSE_MASTER_KEY: ${PULSE_MASTER_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./imports:/data/imports:ro
      - ./exports:/data/exports

volumes:
  pulse-postgres-v17:
